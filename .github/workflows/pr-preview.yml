name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

# Shares the publish lock with production and every other preview.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preview:
    name: Build and publish preview
    runs-on: ubuntu-latest
    # A pull request from a fork gets a read-only token and no secrets, so it
    # cannot publish. Skip rather than fail a contributor's build. (Using
    # `pull_request_target` to work around that would run fork code with write
    # access to this repo — not worth a preview.)
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}

      - name: Build Storybook
        run: npm run build:storybook

      - name: Publish preview
        run: |
          .github/scripts/publish-to-pages.sh \
            ./dist "pr-${{ github.event.pull_request.number }}" \
            "Preview for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- pr-preview-url -->';
            const body = [
              marker,
              `### Preview`,
              ``,
              `| | |`,
              `|---|---|`,
              `| Site | ${url} |`,
              `| Storybook | ${url}storybook/ |`,
              ``,
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. Updates on every push; removed when this PR closes.`,
              ``,
              `Pages can take a minute to serve a fresh publish.`,
            ].join('\n');

            // Update the existing comment rather than adding one per push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
