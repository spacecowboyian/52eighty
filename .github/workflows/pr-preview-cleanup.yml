name: PR preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# Shares the publish lock with production and every other preview.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove preview
    runs-on: ubuntu-latest
    # Matches the guard on the publish job: a fork PR never published anything.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove the preview directory
        run: |
          .github/scripts/publish-to-pages.sh \
            "" "pr-${{ github.event.pull_request.number }}" \
            "Remove preview for PR #${{ github.event.pull_request.number }}"

      - name: Note the teardown on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-url -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker),
            );
            if (!existing) return;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: `${marker}\n### Preview\n\nRemoved — this pull request is closed.`,
            });
