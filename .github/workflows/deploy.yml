name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Production and every pull-request preview publish to the same `gh-pages`
# branch, so they share one concurrency group. Never cancel in progress — a
# half-finished publish would leave the branch mid-rsync.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}

      - name: Build Storybook
        run: npm run build:storybook

      - name: Publish to gh-pages root
        run: |
          .github/scripts/publish-to-pages.sh \
            ./dist "" \
            "Deploy ${{ github.sha }} to production"

      - name: Summary
        run: |
          echo "Published to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
